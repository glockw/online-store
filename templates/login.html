{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="panel estrecho">
  <h2>Iniciar sesión</h2>
  <form method="post" class="formulario">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Usuario <input name="usuario" required autofocus></label>
    <label>Contraseña <input type="password" name="clave" required></label>
    <button class="btn btn-grande">Entrar</button>
  </form>
  <p>¿No tienes cuenta? <a href="{{ url_for('registro', next=next) }}">Regístrate</a></p>
  <p class="nota">Cuenta de prueba: <code>demo</code> / <code>demo123</code> · Admin: <code>admin</code> / <code>admin123</code></p>
</div>
{% endblock %}
